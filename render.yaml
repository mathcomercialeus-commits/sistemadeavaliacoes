services:
  - type: web
    name: sistemadeavaliacoes
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /opt/render/project/src/data/avaliacao_entregadores.db
      - key: ADMIN_USERNAME
        value: FARMALIMA
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false
    disks:
      - name: data
        mountPath: /opt/render/project/src/data
        sizeGB: 1
