services:
  - type: web
    name: sistemadeavaliacoes
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistemadeavaliacoes-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: FARMALIMA
      - key: ADMIN_NAME
        value: Administrador
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RECOVERY_CODE
        sync: false
      - key: LABEL_TOKEN_EXPIRY_HOURS
        value: "48"

databases:
  - name: sistemadeavaliacoes-db
    databaseName: sistemadeavaliacoes
    user: sistemadeavaliacoes
    plan: free
